<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b12">
<title>С днём рождения</title>
<style>
  :root {
    --bg: #0d0b12;
    --ink: #f5ede1;
    --ink-2: #a89a8c;
    --gold: #e3b577;
    --rose: #d98a8f;
    --rule: rgba(245, 237, 225, 0.16);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }

  body {
    font-family: Georgia, 'Times New Roman', serif;
  }

  #bg-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background: var(--bg);
    display: block;
  }

  #scroller {
    position: relative;
    z-index: 1;
    height: 100vh;
    height: 100dvh;
    overflow-y: scroll;
    overflow-x: hidden;
    overscroll-behavior-y: contain;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
  }
  #scroller::-webkit-scrollbar { display: none; }

  .scene {
    min-height: 100vh;
    min-height: 100dvh;
    scroll-snap-align: start;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8vh 7vw;
    text-align: center;
    perspective: 900px;
  }

  .scene-inner {
    max-width: 620px;
    opacity: 0;
    transform: rotateX(-20deg) translateY(28px) scale(0.94);
    transition: opacity 0.9s ease 0.18s, transform 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.18s;
  }
  .scene.is-active .scene-inner { opacity: 1; transform: rotateX(0deg) translateY(0) scale(1); }

  .name {
    font-size: clamp(2.6rem, 11vw, 5.2rem);
    line-height: 1.05;
    font-weight: 400;
    margin: 0 0 0.7rem;
    letter-spacing: 0.01em;
  }

  .sub {
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    font-size: clamp(0.95rem, 3vw, 1.1rem);
    color: var(--ink-2);
    letter-spacing: 0.02em;
    margin: 0;
  }

  .msg {
    font-size: clamp(1.5rem, 6.2vw, 2.3rem);
    line-height: 1.45;
    font-weight: 400;
    margin: 0;
  }

  .stars-row {
    display: flex;
    gap: 0.9rem;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 320px;
    perspective: 600px;
  }
  .star-btn {
    background: none;
    border: none;
    -webkit-appearance: none;
    appearance: none;
    padding: 10px;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.2) translateY(22px);
    transition: opacity 0.5s ease, transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .stars-row.in .star-btn { opacity: 1; transform: scale(1) translateY(0); }
  .star-btn.tapped { transform: scale(1.4); }
  .star-spin {
    display: block;
    width: 30px;
    height: 30px;
    position: relative;
    transform-style: preserve-3d;
    animation: star-tumble 6s linear infinite;
  }
  .star-btn.seen .star-spin { animation-duration: 2.6s; }
  .star-spin .layer {
    position: absolute;
    inset: 0;
    clip-path: polygon(50% 0%, 63% 36%, 100% 50%, 63% 64%, 50% 100%, 37% 64%, 0% 50%, 37% 36%);
    background: var(--ink-2);
  }
  .star-spin .l1 { transform: translateZ(5px); }
  .star-spin .l2 { transform: translateZ(0px); opacity: 0.7; }
  .star-spin .l3 { transform: translateZ(-5px); opacity: 0.4; }
  .star-btn.seen .layer { background: var(--gold); }
  @keyframes star-tumble {
    from { transform: rotateY(0deg) rotateX(14deg); }
    to   { transform: rotateY(360deg) rotateX(14deg); }
  }

  #reason-text {
    min-height: 2.7em;
    max-width: 480px;
  }

  .hint {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(6vh + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--ink-2);
  }
  .hint svg { animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0); opacity: 0.6; }
    50% { transform: translateY(6px); opacity: 1; }
  }

  .press-zone {
    position: relative;
    width: min(48vw, 210px);
    height: min(48vw, 210px);
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    animation: pulse-ring 2.6s ease-in-out infinite;
  }
  .press-zone.done { animation: none; }
  @keyframes pulse-ring {
    0%, 100% { box-shadow: 0 0 0 0 rgba(227, 181, 119, 0); }
    50% { box-shadow: 0 0 0 12px rgba(227, 181, 119, 0.07); }
  }
  .press-zone .ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }
  .press-zone .heart-icon {
    position: relative;
    color: var(--ink-2);
    transition: color 0.4s ease, transform 0.4s ease;
    animation: heart-tumble 4.5s ease-in-out infinite;
  }
  @keyframes heart-tumble {
    0%, 100% { transform: rotateY(0deg); }
    50% { transform: rotateY(360deg); }
  }
  .press-zone.done .heart-icon {
    color: var(--gold);
    transform: scale(1.15);
    animation: none;
  }

  .dots {
    position: fixed;
    z-index: 2;
    right: 0.7rem;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 0.15rem;
  }
  .dots button {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    padding: 0;
    background: transparent;
    cursor: pointer;
    position: relative;
  }
  .dots button::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--rule);
    transform: translate(-50%, -50%);
  }
  .dots button.active::before { background: var(--gold); }

  .finale-bottom {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(7vh + env(safe-area-inset-bottom, 0px));
    padding: 0 8vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
  }
  .finale-bottom p {
    margin: 0;
    color: var(--ink-2);
    font-size: 0.95rem;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .finale-bottom #finale-sign { transition-delay: 0.3s; }
  .finale-bottom .replay {
    margin-top: 1.4rem;
    background: none;
    border: none;
    color: var(--ink-2);
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 1.2s ease 0.6s;
    padding: 0.5rem;
  }

  button:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .hint svg { animation: none; }
    .press-zone { animation: none; }
    .scene-inner { transition: opacity 0.3s ease; transform: none; }
    .star-spin, .heart-icon { animation: none; }
    .star-btn { transition: opacity 0.3s ease; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<nav class="dots" id="dots" aria-label="Разделы"></nav>

<main id="scroller">

  <section class="scene" data-scene="hero">
    <div class="scene-inner">
      <h1 class="name" id="hero-name"></h1>
      <p class="sub" id="hero-sub"></p>
    </div>
    <div class="hint" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 5L8 11L14 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="hero-hint"></span>
    </div>
  </section>

  <section class="scene" data-scene="msg1">
    <div class="scene-inner"><p class="msg" id="msg1"></p></div>
  </section>

  <section class="scene" data-scene="msg2">
    <div class="scene-inner"><p class="msg" id="msg2"></p></div>
  </section>

  <section class="scene" data-scene="reasons">
    <div class="scene-inner" style="display:flex; flex-direction:column; align-items:center; gap:1.8rem;">
      <p class="msg" id="reasons-title" style="font-size:clamp(1.3rem,5.5vw,1.8rem);"></p>
      <div class="stars-row" id="stars-row"></div>
      <p class="sub" id="reason-text"></p>
    </div>
  </section>

  <section class="scene" data-scene="interactive">
    <div class="scene-inner" style="display:flex; flex-direction:column; align-items:center; gap:2.2rem;">
      <p class="msg" id="press-title" style="margin:0;"></p>
      <button class="press-zone" id="press-zone" aria-label="Нажми и удерживай">
        <svg class="ring" viewBox="0 0 100 100">
          <circle id="press-ring" cx="50" cy="50" r="48" fill="none" stroke="#e3b577" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="301.6"/>
        </svg>
        <svg class="heart-icon" width="30" height="30" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50,88 C20,65 5,45 5,28 C5,12 18,2 32,2 C42,2 48,8 50,15 C52,8 58,2 68,2 C82,2 95,12 95,28 C95,45 80,65 50,88 Z" fill="none" stroke="currentColor" stroke-width="3"/>
        </svg>
      </button>
      <p class="sub" id="press-sub"></p>
    </div>
  </section>

  <section class="scene" data-scene="finale">
    <div class="finale-bottom">
      <p id="finale-sign"></p>
      <button class="replay" id="replay-btn"></button>
    </div>
  </section>

</main>

<script>
(function () {
  'use strict';

  /* ====================== ТЕКСТ — меняй под себя ====================== */
  const CONFIG = {
    name: 'Любимая',            // ← имя именинницы
    yourName: '',                // ← необязательно: подпись внизу в конце
    heroSub: 'сегодня особенный день',
    heroHint: 'пролистай вниз',
    messages: [
      'Это не открытка из магазина.',
      'Поэтому вот маленький подарок. Его сложно упаковать в коробку.'
    ],
    reasonsTitle: 'Немного причин',
    reasonsHint: 'нажми на каждую звезду',
    reasons: [
      'Ты делаешь каждый мой день счастливым.',
      'Рядом с тобой я забываю обо всех проблемах.',
      'Из-за тебя моё сердце бьётся чаще.',
      'Ты моя Богиня.'
    ],
    pressTitle: 'Нажми и удерживай',
    pressSub: 'смотри, что получится',
    finaleLine1: ['С ДНЁМ', 'РОЖДЕНИЯ'],
    finaleLine2: ['Я ТЕБЯ', 'ЛЮБЛЮ'],
    replayLabel: 'посмотреть ещё раз'
  };
  /* ===================================================================== */

  document.title = CONFIG.name ? 'С днём рождения, ' + CONFIG.name : 'С днём рождения';
  document.getElementById('hero-name').textContent = CONFIG.name;
  document.getElementById('hero-sub').textContent = CONFIG.heroSub;
  document.getElementById('hero-hint').textContent = CONFIG.heroHint;
  document.getElementById('msg1').textContent = CONFIG.messages[0] || '';
  document.getElementById('msg2').textContent = CONFIG.messages[1] || '';
  document.getElementById('reasons-title').textContent = CONFIG.reasonsTitle;
  document.getElementById('reason-text').textContent = CONFIG.reasonsHint;
  document.getElementById('press-title').textContent = CONFIG.pressTitle;
  document.getElementById('press-sub').textContent = CONFIG.pressSub;
  document.getElementById('replay-btn').textContent = CONFIG.replayLabel;
  if (CONFIG.yourName) {
    document.getElementById('finale-sign').textContent = 'с любовью, ' + CONFIG.yourName;
  }

  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------------------- canvas setup ---------------------------- */
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  const PALETTE = {
    gold:  [227, 181, 119],
    rose:  [217, 138, 143],
    cream: [245, 237, 225],
    amber: [230, 160, 90]
  };
  const sprites = {};
  function buildSprite(rgb) {
    const s = 40;
    const c = document.createElement('canvas');
    c.width = s; c.height = s;
    const sc = c.getContext('2d');
    const grad = sc.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grad.addColorStop(0, 'rgba(' + rgb.join(',') + ',1)');
    grad.addColorStop(0.35, 'rgba(' + rgb.join(',') + ',0.55)');
    grad.addColorStop(1, 'rgba(' + rgb.join(',') + ',0)');
    sc.fillStyle = grad;
    sc.fillRect(0, 0, s, s);
    return c;
  }
  Object.keys(PALETTE).forEach(function (k) { sprites[k] = buildSprite(PALETTE[k]); });

  function rand(a, b) { return a + Math.random() * (b - a); }

  const PARTICLE_N = 650;
  let particles = [];
  let bursts = [];

  function Particle() { this.reset(); }
  Particle.prototype.reset = function () {
    this.x = rand(0, W); this.y = rand(0, H);
    this.vx = rand(-0.05, 0.05); this.vy = rand(-0.08, -0.015);
    this.r = rand(1.0, 2.4);
    this.baseAlpha = rand(0.18, 0.55);
    this.tw = rand(0, Math.PI * 2);
    this.color = 'gold';
    this.gatherScale = 1;
    this.gatherDelay = 0;
    this.tx = null; this.ty = null;
  };
  Particle.prototype.setTarget = function (pt, color, scale, delay) {
    this.tx = pt.x + rand(-2, 2);
    this.ty = pt.y + rand(-2, 2);
    if (color) this.color = color;
    this.gatherScale = (scale === undefined) ? 1 : scale;
    this.gatherDelay = delay || 0;
  };
  Particle.prototype.clearTarget = function () { this.tx = null; this.ty = null; };
  Particle.prototype.update = function (dt) {
    this.tw += dt * 0.0016;
    if (this.tx !== null) {
      if (this.gatherDelay > 0) { this.gatherDelay -= dt; return; }
      const k = this.gatherScale < 1 ? 0.1 : 0.07;
      this.x += (this.tx - this.x) * k;
      this.y += (this.ty - this.y) * k;
    } else {
      this.x += this.vx * dt * 0.06;
      this.y += this.vy * dt * 0.06;
      if (this.x < -10) this.x = W + 10;
      if (this.x > W + 10) this.x = -10;
      if (this.y < -10) this.y = H + 10;
      if (this.y > H + 10) this.y = -10;
    }
  };
  Particle.prototype.draw = function () {
    const twinkle = this.tx !== null ? 1 : (0.5 + 0.5 * Math.sin(this.tw));
    const a = this.baseAlpha * twinkle * globalEnergy * (this.tx !== null ? 1.6 : 1);
    if (a <= 0.01) return;
    ctx.globalAlpha = Math.min(a, 1);
    const s = this.r * (this.tx !== null ? 5.4 * this.gatherScale : 4.2);
    ctx.drawImage(sprites[this.color], this.x - s / 2, this.y - s / 2, s, s);
  };

  function initParticles() {
    particles = [];
    for (let i = 0; i < PARTICLE_N; i++) particles.push(new Particle());
  }

  function spawnBurst(x, y, count, colors) {
    for (let i = 0; i < count; i++) {
      const ang = rand(0, Math.PI * 2);
      const sp = rand(0.5, 3.4);
      bursts.push({
        x: x, y: y,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 1.1,
        r: rand(0.9, 2.4),
        color: colors[Math.floor(rand(0, colors.length))],
        life: 0, maxLife: rand(700, 1500)
      });
    }
  }
  function updateBursts(dt) {
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.life += dt;
      if (b.life > b.maxLife) { bursts.splice(i, 1); continue; }
      b.vy += dt * 0.0009;
      b.vx *= 0.992; b.vy *= 0.992;
      b.x += b.vx * dt * 0.06;
      b.y += b.vy * dt * 0.06;
    }
  }
  function drawBursts() {
    for (let i = 0; i < bursts.length; i++) {
      const b = bursts[i];
      const t = b.life / b.maxLife;
      ctx.globalAlpha = Math.max(0, (1 - t) * 0.9);
      const s = b.r * 4.6;
      ctx.drawImage(sprites[b.color], b.x - s / 2, b.y - s / 2, s, s);
    }
  }

  /* ---------------------------------- flashes ---------------------------------- */
  let flashes = [];
  function spawnFlash(x, y, maxR, life) {
    flashes.push({ x: x, y: y, maxR: maxR, life: 0, maxLife: life });
  }
  function updateDrawFlashes(dt) {
    for (let i = flashes.length - 1; i >= 0; i--) {
      const f = flashes[i];
      f.life += dt;
      if (f.life > f.maxLife) { flashes.splice(i, 1); continue; }
      const t = f.life / f.maxLife;
      const r = f.maxR * (0.25 + 0.85 * t);
      const alpha = (1 - t) * (1 - t) * 0.75;
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
      g.addColorStop(0, 'rgba(245,237,225,' + alpha + ')');
      g.addColorStop(0.45, 'rgba(227,181,119,' + (alpha * 0.5) + ')');
      g.addColorStop(1, 'rgba(227,181,119,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* ------------------------------------ rain ------------------------------------ */
  let rain = [];
  let rainActive = false, rainSince = 0;
  function spawnRaindrop() {
    rain.push({
      x: rand(0, W), y: -20,
      vy: rand(0.16, 0.34), vx: rand(-0.04, 0.04),
      r: rand(0.6, 1.7),
      color: ['gold', 'cream', 'rose'][Math.floor(rand(0, 3))],
      tw: rand(0, Math.PI * 2)
    });
  }
  function updateDrawRain(dt) {
    if (rainActive) {
      rainSince += dt;
      if (rainSince > 130) { rainSince = 0; spawnRaindrop(); spawnRaindrop(); }
    }
    for (let i = rain.length - 1; i >= 0; i--) {
      const d = rain[i];
      d.y += d.vy * dt * 0.06;
      d.x += d.vx * dt * 0.06;
      d.tw += dt * 0.002;
      if (d.y > H + 20) { rain.splice(i, 1); continue; }
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(d.tw);
      const s = d.r * 4;
      ctx.drawImage(sprites[d.color], d.x - s / 2, d.y - s / 2, s, s);
    }
  }

  /* ------------------------- shape / text sampling ------------------------- */
  function samplePoints(drawFn, step) {
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const octx = off.getContext('2d');
    drawFn(octx);
    let data;
    try { data = octx.getImageData(0, 0, W, H).data; }
    catch (e) { return []; }
    const pts = [];
    for (let y = 0; y < H; y += step) {
      for (let x = 0; x < W; x += step) {
        if (data[(y * W + x) * 4 + 3] > 120) pts.push({ x: x, y: y });
      }
    }
    for (let i = pts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = pts[i]; pts[i] = pts[j]; pts[j] = tmp;
    }
    return pts;
  }

  function heartPath(c, cx, cy, size) {
    const top = size * 0.3;
    c.beginPath();
    c.moveTo(cx, cy + top);
    c.bezierCurveTo(cx, cy, cx - size / 2, cy, cx - size / 2, cy + top);
    c.bezierCurveTo(cx - size / 2, cy + (size + top) / 2, cx, cy + (size + top) / 2, cx, cy + size);
    c.bezierCurveTo(cx, cy + (size + top) / 2, cx + size / 2, cy + (size + top) / 2, cx + size / 2, cy + top);
    c.bezierCurveTo(cx + size / 2, cy, cx, cy, cx, cy + top);
    c.closePath();
  }
  function drawHeartShape(octx) {
    octx.fillStyle = '#fff';
    const size = Math.min(W, H) * 0.42;
    heartPath(octx, W / 2, H / 2 - size * 0.32, size);
    octx.fill();
  }

  function fitFontSize(octx, lines, maxWidth, start) {
    let size = start;
    octx.textAlign = 'center'; octx.textBaseline = 'middle';
    while (size > 10) {
      octx.font = '700 ' + size + 'px Georgia, serif';
      let widest = 0;
      for (let i = 0; i < lines.length; i++) widest = Math.max(widest, octx.measureText(lines[i]).width);
      if (widest <= maxWidth) break;
      size -= 2;
    }
    return size;
  }
  function drawTextShape(lines) {
    return function (octx) {
      octx.fillStyle = '#fff';
      const maxWidth = W * 0.86;
      const size = fitFontSize(octx, lines, maxWidth, Math.min(W, H) * 0.22);
      const lh = size * 1.08;
      const startY = H / 2 - (lines.length - 1) * lh / 2;
      for (let i = 0; i < lines.length; i++) octx.fillText(lines[i], W / 2, startY + i * lh);
    };
  }

  let heartPoints = [];
  function recomputeShapes() {
    heartPoints = samplePoints(drawHeartShape, Math.max(4, Math.round(W / 95)));
  }

  function assign(points, color, count, scale, staggerMs) {
    const total = particles.length;
    const n = (count === undefined) ? total : count;
    if (!points.length) {
      for (let i = 0; i < total; i++) particles[i].clearTarget();
      return;
    }
    const stride = points.length / total;
    for (let i = 0; i < total; i++) {
      if (i < n) {
        const idx = Math.floor(i * stride) % points.length;
        const delay = staggerMs ? rand(0, staggerMs) : 0;
        particles[i].setTarget(points[idx], color, scale, delay);
      } else {
        particles[i].clearTarget();
      }
    }
  }
  function release() {
    for (let i = 0; i < particles.length; i++) particles[i].clearTarget();
  }

  /* --------------------------------- resize --------------------------------- */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    recomputeShapes();
  }
  function debounce(fn, ms) {
    let t;
    return function () {
      const args = arguments;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(null, args); }, ms);
    };
  }
  window.addEventListener('resize', debounce(resize, 200));

  /* ------------------------------- render loop ------------------------------- */
  let globalEnergy = 0.55, targetEnergy = 0.55;
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(now - last, 48); last = now;
    globalEnergy += (targetEnergy - globalEnergy) * 0.02;
    if (holding && !achieved) updateHoldProgress(now);

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    updateDrawRain(dt);
    for (let i = 0; i < particles.length; i++) particles[i].update(dt);
    updateBursts(dt);
    for (let i = 0; i < particles.length; i++) particles[i].draw();
    drawBursts();
    updateDrawFlashes(dt);
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(frame);
  }

  /* ---------------------------------- scenes ---------------------------------- */
  const scenes = Array.prototype.slice.call(document.querySelectorAll('.scene'));
  const scroller = document.getElementById('scroller');
  const dotsWrap = document.getElementById('dots');
  scenes.forEach(function (s, i) {
    const b = document.createElement('button');
    b.setAttribute('aria-label', 'Раздел ' + (i + 1));
    b.addEventListener('click', function () { s.scrollIntoView({ behavior: 'smooth' }); });
    dotsWrap.appendChild(b);
  });
  const dotEls = Array.prototype.slice.call(dotsWrap.children);

  const energyByScene = { hero: 0.5, msg1: 0.62, msg2: 0.7, reasons: 0.78, interactive: 0.85, finale: 1 };

  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      const el = e.target;
      const idx = scenes.indexOf(el);
      if (e.isIntersecting && e.intersectionRatio > 0.55) {
        el.classList.add('is-active');
        dotEls.forEach(function (d, i) { d.classList.toggle('active', i === idx); });
        onSceneEnter(el.dataset.scene);
      } else {
        el.classList.remove('is-active');
      }
    });
  }, { root: scroller, threshold: [0.55] });
  scenes.forEach(function (s) { io.observe(s); });

  function onSceneEnter(name) {
    if (energyByScene[name] !== undefined) targetEnergy = energyByScene[name];
    if (name === 'reasons') starsRow.classList.add('in');
    if (name === 'finale') playFinale();
  }

  /* ---------------------------------- reasons ---------------------------------- */
  const starsRow = document.getElementById('stars-row');
  const reasonText = document.getElementById('reason-text');
  CONFIG.reasons.forEach(function (text, i) {
    const b = document.createElement('button');
    b.className = 'star-btn';
    b.style.transitionDelay = (i * 0.18) + 's';
    b.setAttribute('aria-label', 'Причина ' + (i + 1));
    b.innerHTML = '<span class="star-spin"><span class="layer l1"></span><span class="layer l2"></span><span class="layer l3"></span></span>';
    b.addEventListener('click', function () {
      reasonText.textContent = text;
      b.classList.add('seen', 'tapped');
      setTimeout(function () { b.classList.remove('tapped'); }, 260);
      const r = b.getBoundingClientRect();
      spawnBurst(r.left + r.width / 2, r.top + r.height / 2, 14, ['gold', 'cream']);
      spawnFlash(r.left + r.width / 2, r.top + r.height / 2, 90, 500);
    });
    starsRow.appendChild(b);
  });

  /* ---------------------------- press & hold gesture ---------------------------- */
  const pressZone = document.getElementById('press-zone');
  const pressRing = document.getElementById('press-ring');
  const RING_LEN = 301.6;
  const HOLD_MS = 1600;
  let holding = false, holdStart = 0, achieved = false;

  function updateHoldProgress(now) {
    const t = Math.min(1, (now - holdStart) / HOLD_MS);
    pressRing.style.strokeDashoffset = String(RING_LEN * (1 - t));
    assign(heartPoints, 'gold', Math.floor(t * particles.length));
    if (t >= 1) {
      achieved = true; holding = false;
      pressZone.classList.add('done');
      if (navigator.vibrate) navigator.vibrate(40);
      setTimeout(function () {
        document.querySelector('[data-scene="finale"]').scrollIntoView({ behavior: 'smooth' });
      }, 700);
    }
  }
  function startHold(e) {
    if (achieved || holding) return;
    e.preventDefault();
    holding = true;
    holdStart = performance.now();
  }
  function endHold() {
    if (achieved) return;
    holding = false;
    pressRing.style.strokeDashoffset = String(RING_LEN);
    release();
  }
  pressZone.addEventListener('pointerdown', startHold);
  pressZone.addEventListener('pointerup', endHold);
  pressZone.addEventListener('pointerleave', endHold);
  pressZone.addEventListener('pointercancel', endHold);
  pressZone.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') startHold(e);
  });
  pressZone.addEventListener('keyup', function (e) {
    if (e.key === ' ' || e.key === 'Enter') endHold();
  });

  /* ----------------------------------- finale ----------------------------------- */
  function wait(ms) { return new Promise(function (r) { setTimeout(r, reducedMotion ? Math.min(ms, 150) : ms); }); }

  let finalePlayed = false;
  async function playFinale() {
    if (finalePlayed) return;
    finalePlayed = true;
    rainActive = true;

    if (!achieved) {
      assign(heartPoints, 'gold');
      await wait(1200);
    }

    const size = Math.min(W, H) * 0.42;
    const hx = W / 2, hy = H / 2 - size * 0.32;

    spawnFlash(hx, hy, Math.max(W, H) * 0.9, reducedMotion ? 300 : 900);
    spawnBurst(hx, hy, reducedMotion ? 50 : 260, ['gold', 'rose', 'cream', 'amber']);
    await wait(200);
    spawnBurst(hx, hy, reducedMotion ? 20 : 90, ['cream', 'gold']);
    await wait(700);

    const step = Math.max(2, Math.round(W / 200));

    const t1 = samplePoints(drawTextShape(CONFIG.finaleLine1), step);
    spawnFlash(W / 2, H / 2, Math.max(W, H) * 0.55, 700);
    assign(t1, 'cream', undefined, 0.42, 550);
    await wait(3400);

    const t2 = samplePoints(drawTextShape([CONFIG.name]), step);
    spawnFlash(W / 2, H / 2, Math.max(W, H) * 0.55, 700);
    assign(t2, 'gold', undefined, 0.42, 550);
    await wait(3400);

    const t3 = samplePoints(drawTextShape(CONFIG.finaleLine2), step);
    spawnFlash(W / 2, H / 2, Math.max(W, H) * 0.6, 800);
    assign(t3, 'rose', undefined, 0.42, 550);
    await wait(1400);

    const sign = document.getElementById('finale-sign');
    if (sign.textContent) sign.style.opacity = '1';
    const replay = document.getElementById('replay-btn');
    replay.style.opacity = '1';
    replay.addEventListener('click', function onReplay() {
      finalePlayed = false; achieved = false; holding = false;
      bursts = []; rain = []; rainActive = false;
      pressZone.classList.remove('done');
      pressRing.style.strokeDashoffset = String(RING_LEN);
      document.querySelector('[data-scene="hero"]').scrollIntoView({ behavior: 'smooth' });
      setTimeout(function () {
        release();
        sign.style.opacity = '0';
        replay.style.opacity = '0';
      }, 800);
    }, { once: true });
  }

  /* ---------------------------- ambient tap sparkle ---------------------------- */
  scroller.addEventListener('pointerdown', function (e) {
    if (e.target.closest('#press-zone, .dots, .replay, .star-btn')) return;
    spawnBurst(e.clientX, e.clientY, 16, ['gold', 'cream']);
  });

  /* ------------------------------------ init ------------------------------------ */
  resize();
  initParticles();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
